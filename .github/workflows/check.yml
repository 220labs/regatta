# The repo's check in CI, so a pull request proves itself before it lands.
#
# The `run:` line is the `check:` command from AGENTS.md's session contract, the same command a
# session runs locally: the marketplace and every module, then each module's tests/check.sh. A new
# module appends its check here and there in the same change.
#
# The runner comes from the CI_RUNS_ON repository variable (see the job); unset, as in the twin
# and forks, it is ubuntu, and on a private repo the job fails at its first step instead. A matrix job reports as `check (<value>)`, and the branch protection must name exactly that;
# read the names back with `gh pr checks <n>`, never predict them.
# helloworld's suite makes scratch commits, some in repos with no identity of their own: the
# runner gets one below, and the full history is not needed (each suite builds its own repos).
#
# Two roads, by whether the repo names a runner (free CI's S2, 2026-11-04):
#   - CI_RUNS_ON or CI_RUNS_ON_FULL set (the private repo, on its own Macs): the `check` job below runs
#     the whole line, or on a pull request its macOS share (CI_LINUX_ELSEWHERE), as before; the jobs
#     after it are skipped.
#   - neither set (the public twin, a fork): the line in shares, so a run takes its slowest suite's
#     time, about 7 minutes, not the line's 15. `plan` reads the Linux list (.github/ci/linux-ids,
#     through share.sh), `suite` runs each of its commands as a job of its own on ubuntu-latest,
#     the `check` job runs the rest of the line as `check (the rest)`, and `gather` reports the whole
#     verdict as `check`, the name the twin's protection and helloworld's nightly (`twin-check`) read.
#     A job skipped by its `if` reports its name's expression text, never `check` (the job's notes).
name: check
on:
  # A push to main runs the check unless the repository variable CI_SKIP_MAIN_PUSH is `true` (the job's
  # condition). Set it where every merge is a rebase of a pull request whose own run checked that tree, as far as its scope reached:
  # there the run main's push started took 40–77 min of the one runner for each of the day's dozen
  # landings — about 40 % of its load, and the queue every PR waited in (docs/check-load-2026-10-23.md).
  # What it gives up: a PR's run tests main as it was when the run started (the protection's `strict` is
  # off), so a tree landed after a neighbour's merge was not run exactly; /finish rebases right before
  # its push, and the nightly run on main below catches the rest. A hand start (workflow_dispatch) is
  # there for a doubt. A twin or a fork without the variable keeps the run on every push.
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * *'   # 09:17 UTC daily, when a landing is seldom in flight
  workflow_dispatch:
  # ready_for_review: a draft's pushes skip the job below, so leaving draft is what runs it.
  # closed: runs no job, but joins the concurrency group below and so cancels a run still going when
  # the PR closes (wharf's template since 2026-10-18; here since costs S1, 2026-10-24). `pr merge`
  # waits for this head's run before merging, so a merge cancels nothing it needs.
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, closed]
permissions:
  contents: read
  checks: read   # the carry step reads the previous head's `check`
# A newer push to the same ref makes the older run moot; every run bills the account's minutes.
concurrency:
  # per event too: a push run whose job is skipped (CI_SKIP_MAIN_PUSH) would otherwise cancel a nightly
  # or hand-started run on main that is going. Keyed on the PR number where there is one: a merged
  # PR's `closed` event carries the base branch in github.ref, not refs/pull/N/merge.
  # And per draft: a `synchronize` run whose payload still says draft (its job skips) started a second
  # after the `ready_for_review` run and cancelled it, so no check completed and the merge waited for a
  # hand re-run (a sibling repo's #499, 2026-10-25). A skipped draft run now sits in its own group; a
  # newer live run still cancels an older one, and `closed` still cancels a live run, its payload
  # saying draft false once the PR was ready. `&&` returns its first falsy operand, else its last, and
  # `||` its first truthy one (actions/runner's Expressions2 And.cs and Or.cs), so a push, a schedule
  # or a hand start, with no draft at all, reads `live`. Only github, inputs and vars reach a group:
  # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#concurrency
  group: check-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}-${{ github.event.pull_request.draft && 'draft' || 'live' }}
  cancel-in-progress: true
jobs:
  check:
    # Named for the draft too: the skipped draft run survives (the group above keeps it from cancelling
    # the ready run), GitHub reports a skipped job as a passed check, and branch protection requires
    # `check`, so a skipped run reporting under that name could let a merge through before the live
    # run finishes. Only a live run is `check` now; a draft's reports `check (draft)`, which nothing
    # requires. `jobs.<job_id>.name` reaches the github context (the table at
    # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#context-availability).
    # Seen live on a sibling repo's draft head (2026-10-27, `gh api …/commits/<sha>/check-runs`): a job
    # skipped by its `if` is not evaluated, and reports this expression's text as its name; a live
    # run reports `check`. Either way a skipped run is never `check`.
    # On the shares' road (no runner variable) this job is the rest, and `gather` is `check`.
    name: ${{ github.event.pull_request.draft && 'check (draft)' || !vars.CI_RUNS_ON && !vars.CI_RUNS_ON_FULL && 'check (the rest)' || 'check' }}
    # Not on a draft: the checkpoint hook pushes one every ~10 min, and those runs were most
    # of the account's minutes (2026-10-17). GitHub reports a skipped job as a passed
    # check, so a merge waits for a run on this head that is not skipped.
    if: >-
      (github.event_name != 'pull_request' ||
        (github.event.action != 'closed' && !github.event.pull_request.draft)) &&
      (github.event_name != 'push' || vars.CI_SKIP_MAIN_PUSH != 'true')
    # The runner comes from the repository variable CI_RUNS_ON (a JSON label list), ubuntu-latest
    # where it is unset: a repo that runs its check on its own machine sets it in its settings,
    # so this file, which the public twin publishes too, names no machine. A self-hosted runner
    # runs every pull request's code as its login, with that machine's credentials in reach: set
    # the variable only on a repo whose every writer you trust, never on one that takes forks' PRs.
    # A push, the nightly run and a hand start take CI_RUNS_ON_FULL's labels where it is set: they
    # run the whole line (below), which a slower runner taking only a pull request's macOS share
    # cannot (a 2016 laptop: the share in 41 min, the whole line in 95, 2026-10-27). wharf's
    # ci-provider reads and keeps this form as its own; CI_RUNS_ON_FULL is set by hand. Each variable
    # lists capabilities, never a machine (`whole-line`, `browser` …; wharf's README, "Capabilities"):
    # a runner's capabilities sit in config and `ci-provider --runner caps` sets them at once.
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && vars.CI_RUNS_ON_FULL || vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    # The job ran 40.45 min on the idle build Mac (run 40012393574, 2026-10-23: keel 8.2, wharf-runs
    # 13.5) and 51.5 min beside its sessions (runs 40121322251 and 40121340160, 2026-10-24), so 60
    # was about 1.2 times the slowest job, no longer twice it (docs/check-load-2026-10-23.md's Evidence,
    # docs/host-power-costs-2026-10-24.md finding 8; re-read from the records, 2026-10-24).
    # 90 since 2026-10-26: the merged runs that evening took 54 and 55 min (40429766668, 40414482058),
    # and a run beside 6 to 7 busy dispatch runs (load 8 to 11) was cut at 60 twice in helm's suite,
    # with every case before the cut passing (40435572133, attempts 1 and 2). A run over 90 is
    # a suite gone slow, or the runner under more load than on 2026-10-26.
    timeout-minutes: 90
    # keel's step runs where its session gate is: without hooks/sheep_gate.py keel's sheep fails
    # closed and its suite with it (178 cases on the twin's files, 2026-10-22). helm's step needs that
    # gate too (talk_nudge's cases). sheep_gate.py is public since keel-held (2026-10-23); the guard
    # stays for a copy without it.
    steps:
      # A private repo with no CI_RUNS_ON would run on ubuntu-latest, which bills the account's minutes
      # past the free quota (another private repo's hosted jobs were refused for billing from 2026-10-19). There the
      # job fails here, at once, saying why: never an `if:` on the job, which GitHub reports as a passed
      # check (costs S1, docs/host-power-costs-2026-10-24.md). This step's one minute is all this job bills; with no runner
      # variable, the shares' `plan` fails at its own copy of the guard and `gather` reports it, a minute each.
      # The twin is public and keeps ubuntu-latest, which is free there. Judged by where the job
      # landed, not by CI_RUNS_ON alone: with the split runs-on, a push may take CI_RUNS_ON_FULL's
      # runner while CI_RUNS_ON is unset (review 2026-10-27).
      - name: a private repo names its runner
        if: runner.environment != 'self-hosted'
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          # a payload without the repository (a scheduled run's may lack it) asks the API; a visibility
          # that cannot be read fails like a private one
          [ -n "$PRIVATE" ] || PRIVATE="$(gh api "repos/$GITHUB_REPOSITORY" --jq .private || true)"
          if [ "$PRIVATE" != false ]; then
            echo "::error title=CI_RUNS_ON unset::$GITHUB_REPOSITORY is private (or its visibility unreadable: '$PRIVATE') and names no runner, so this check would bill ubuntu-latest minutes. Set the repository variable CI_RUNS_ON (wharf's ci-provider) and run it again."
            exit 1
          fi
      # On a machine of one's own the runner's login is a real one: HOME, git's global config and the
      # regatta config dir go to this job's temp dir (emptied at each job's start and end), never that
      # login's own, so a case that forgets to move HOME writes here. PyYAML is a per-user install
      # there: its user base is read before HOME moves (regatta's suites-host D1, 2026-10-21).
      - name: this job's own HOME, git config and regatta config dir
        # a hosted runner's HOME is thrown away anyway: there the job runs as it did before
        if: runner.environment == 'self-hosted'
        run: |
          mkdir -p "$RUNNER_TEMP/home" "$RUNNER_TEMP/regatta-config"
          : > "$RUNNER_TEMP/gitconfig"
          # an empty user base would pass silently and lose PyYAML in a dozen unrelated cases
          base="$(python3 -m site --user-base)"
          [ -n "$base" ]
          echo "PYTHONUSERBASE=$base" >> "$GITHUB_ENV"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig" >> "$GITHUB_ENV"
          echo "REGATTA_CONFIG=$RUNNER_TEMP/regatta-config" >> "$GITHUB_ENV"
      # A pull request's checkout is its merge commit (refs/pull/N/merge); depth 2 brings both parents, so
      # the macOS share below can ask what the PR adds to its base (HEAD^1..HEAD, share.sh macos --scoped).
      # Anything else needs one commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Into setup-node's own Node in the runner's tool cache, first on this job's PATH only: on
      # a self-hosted runner it never touched the runner login's claude (read back 2026-10-21).
      # The CLI leaves its stdout pipe O_NONBLOCK when it exits (probed: `claude plugin validate`, 2.1.302;
      # plain node does not), and the flag is the pipe's, so every suite after the line's first command
      # wrote to a non-blocking pipe: on a loaded runner a write met a full pipe and failed EAGAIN, and
      # wharf-runs' lane printouts stopped at 64 KiB, its failing case unprinted (regatta#388;
      # docs/runner-interference-2026-11-02.md). A wrapper first on the job's PATH runs the CLI, then
      # makes stdout and stderr blocking again, so the line stays as it is: stderr as fd 3, a copy of it, since
      # python's own 2>/dev/null would clear /dev/null's flag, not the pipe's (the landing review, probed).
      - name: claude CLI
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.302
          real="$(command -v claude)"
          mkdir -p "$RUNNER_TEMP/claude-blocking"
          cat > "$RUNNER_TEMP/claude-blocking/claude" <<EOF
          #!/bin/bash
          "$real" "\$@"
          rc=\$?
          python3 -c 'import fcntl, os; [fcntl.fcntl(f, fcntl.F_SETFL, fcntl.fcntl(f, fcntl.F_GETFL) & ~os.O_NONBLOCK) for f in (1, 3)]' 3>&2 2>/dev/null
          exit \$rc
          EOF
          chmod +x "$RUNNER_TEMP/claude-blocking/claude"
          echo "$RUNNER_TEMP/claude-blocking" >> "$GITHUB_PATH"
      - name: a git identity for the suites' scratch commits
        run: |
          git config --global user.name "CI"
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
      # CI_LINUX_ELSEWHERE `true` (a repo whose Linux-proven suites run in check-linux, on GitHub Actions or CircleCI, which
      # main's protection then requires too): on a pull request this runner takes only the rest, the
      # macOS share (.github/ci/share.sh). A push, the nightly run and a hand start run the whole line,
      # so the suites' Darwin branches are still run on a Mac each day. Where no runner variable is set
      # (the twin, forks), the Linux list runs in the `suite` jobs below and this job only the rest, on
      # every event. Exactly one of the three steps runs. The `check` step keeps its name and its one
      # `run:` block: share.sh, twin-linux.sh and ci-provider read the line from it.
      # The share is scoped (free-ci S3, 2026-11-04): on a pull request only the suites the head's change
      # reaches run, by wharf-runs' check_scope.py, the verdicts a session's `check <worktree>` gives, and
      # the rest print `SKIP <id>`. A head whose change cannot be read, or that changes a workflow, .github/ci/
      # or check_scope.py itself, runs the whole share. The push, the nightly run and a hand start never
      # reach this step: they run the whole line below, so a scope miss shows in main's 09:17 UTC run
      # (a push of main runs nothing where CI_SKIP_MAIN_PUSH is set), read by hand: no card reads it yet
      # (TODO.md [free-ci-main-red]). While CI_LINUX_ELSEWHERE is not `true` the whole line runs, unscoped
      # (TODO.md [free-ci-s3-share-off]).
      # The carry (wharf's `pr restack`, 2026-11-04): a push whose patch is the previous head's, list files
      # (TODO.md, CHANGELOG.md) aside, keeps that head's green instead of running again. It is what `pr restack`
      # pushes when GitHub marks a ready PR DIRTY on a list file alone, and the 85-min re-run it would start
      # tested nothing new: the PR's code is the tested code, and main's own commits between the two bases are
      # what `strict: false` (main-protection.json) already lands untested. No suite reads this repo's lists bar
      # `todo-md lint`, which runs here. `pr carry` judges it from git alone, and the judge is the base's copy (a
      # worktree of origin/$BASE), never the PR's own: a push that broke carry_verdict would otherwise decide its
      # own test (the build review). Any doubt (the newest `check` on the previous head not green, a commit not
      # fetchable, a code path, mode or type that differs) runs the check as before (on a pull request, the scoped share below).
      - name: carry the previous head's green
        id: carry
        if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          [ -n "$BEFORE" ] || { echo "carry: nothing to carry from"; exit 0; }
          # the newest run only (filter=latest): an earlier green attempt must not hide a red re-run
          green="$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                     "https://api.github.com/repos/$REPO/commits/$BEFORE/check-runs?check_name=check&filter=latest" \
                   | jq -r '[.check_runs[]? | select(.app.slug == "github-actions")] | (length > 0 and all(.conclusion == "success"))' 2>/dev/null)" || green=false
          [ "$green" = true ] || { echo "carry: ${BEFORE:0:8}'s newest check is not green: the check runs"; exit 0; }
          git fetch -q --no-tags --unshallow origin "$BEFORE" "$SHA" "+refs/heads/$BASE:refs/remotes/origin/$BASE" 2>/dev/null \
            || git fetch -q --no-tags origin "$BEFORE" "$SHA" "+refs/heads/$BASE:refs/remotes/origin/$BASE" \
            || { echo "carry: ${BEFORE:0:8} could not be fetched: the check runs"; exit 0; }
          J="$RUNNER_TEMP/carry-judge"; git worktree prune || true   # a prune that fails is no reason to fail the check: `add` below decides
          git worktree add -q --detach "$J" "origin/$BASE" && [ -f "$J/modules/wharf/libexec/pr" ] \
            || { echo "carry: the base has no pr carry: the check runs"; exit 0; }
          verdict="$(python3 "$J/modules/wharf/libexec/pr" carry "$BEFORE" "$SHA" --base "origin/$BASE")" || { echo "carry: $verdict: the check runs"; exit 0; }
          { [ ! -f TODO.md ] || python3 "$J/modules/wharf/bin/todo-md" lint .; } || { echo "carry: todo-md lint fails: the check runs"; exit 0; }
          echo "carry: $verdict, green on ${BEFORE:0:8}: not run again"
          echo "carry=true" >> "$GITHUB_OUTPUT"
      - name: check, the macOS share
        if: steps.carry.outputs.carry != 'true' && vars.CI_LINUX_ELSEWHERE == 'true' && github.event_name == 'pull_request' && (vars.CI_RUNS_ON || vars.CI_RUNS_ON_FULL)
        run: bash .github/ci/share.sh macos --scoped
      - name: check, the rest
        if: ${{ steps.carry.outputs.carry != 'true' && !vars.CI_RUNS_ON && !vars.CI_RUNS_ON_FULL }}
        run: bash .github/ci/share.sh rest
      - name: check
        if: steps.carry.outputs.carry != 'true' && (vars.CI_LINUX_ELSEWHERE != 'true' || github.event_name != 'pull_request') && (vars.CI_RUNS_ON || vars.CI_RUNS_ON_FULL)
        run: |
          claude plugin validate --strict . && bash modules/regatta/tests/check.sh && bash modules/regatta/tests/classes.sh && bash modules/helloworld/tests/check.sh && bash modules/plumb/tests/check.sh && { [ ! -f modules/keel/hooks/sheep_gate.py ] || bash modules/keel/tests/check.sh; } && bash modules/sextant/tests/check.sh && bash modules/wharf-runs/tests/check.sh && bash modules/lighthouse/tests/check.sh && bash modules/wharf/tests/check.sh && bash modules/aurora/tests/check.sh && bash modules/atlas/tests/check.sh && { [ ! -f modules/keel/hooks/sheep_gate.py ] || bash modules/helm/tests/check.sh; } && { [ ! -f TODO.md ] || python3 modules/wharf/bin/todo-md lint .; }
  # The shares' road (the header's second): the jobs below run only where no runner variable is set,
  # and each condition starts with check's own, so a draft, a closed PR and a skipped main push skip
  # them too. They run on GitHub's ubuntu-latest, free on a public repo; `plan` refuses a private one
  # first, as check's first step does, and every job below waits on it.
  plan:
    if: >-
      (github.event_name != 'pull_request' ||
        (github.event.action != 'closed' && !github.event.pull_request.draft)) &&
      (github.event_name != 'push' || vars.CI_SKIP_MAIN_PUSH != 'true') &&
      !vars.CI_RUNS_ON && !vars.CI_RUNS_ON_FULL
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - name: a private repo names its runner
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          # as check's first step: a visibility that cannot be read fails like a private one
          [ -n "$PRIVATE" ] || PRIVATE="$(gh api "repos/$GITHUB_REPOSITORY" --jq .private || true)"
          if [ "$PRIVATE" != false ]; then
            echo "::error title=CI_RUNS_ON unset::$GITHUB_REPOSITORY is private (or its visibility unreadable: '$PRIVATE') and names no runner, so its suites would bill ubuntu-latest minutes. Set the repository variable CI_RUNS_ON (wharf's ci-provider) and run it again."
            exit 1
          fi
      - uses: actions/checkout@v4
      # the whole list, not share.sh's scoped one: the twin's run judges a publish, which may carry
      # any number of the private repo's landings
      - name: the Linux list
        id: ids
        # a refusal fails here, saying why, never as an empty matrix on the jobs after
        run: |
          ids="$(bash .github/ci/share.sh linux-ids)" || { echo "::error::share.sh gave no Linux list"; exit 1; }
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
  suite:
    # one command of the Linux list; a failure fails this job, and `gather` reads every result
    needs: plan
    runs-on: ubuntu-latest
    # keel's suite runs about 10 minutes, wharf-runs' Linux scripts about as long (check-linux.yml's 50)
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      # what check's setup steps give its job, by the script check-linux.yml's suites use: Node 22,
      # the pinned claude CLI, PyYAML, a git identity; its PATH in ~/.linux-path, never $BASH_ENV
      - name: the runner's tools
        run: bash .github/ci/linux-tools.sh
      - name: the suite
        # a step past its timeout fails (the job's own cancels), so `gather` reads it as a failure
        timeout-minutes: 40
        env:
          ID: ${{ matrix.id }}
        run: |
          export PATH="$(cat "$HOME/.linux-path")"
          bash .github/ci/share.sh linux "$ID"
  gather:
    # The verdict under `check`: green only when the list was read, every suite passed and the rest
    # passed. Named by an expression, so a run where this job is skipped (the private repo, a draft)
    # reports the expression's text, never `check`, which a skipped job would pass. Not on a cancelled
    # run: a newer push's run judges its own head, and a red here would read as that head's.
    name: ${{ !vars.CI_RUNS_ON && !vars.CI_RUNS_ON_FULL && 'check' || 'check (gather)' }}
    needs: [plan, suite, check]
    if: >-
      (github.event_name != 'pull_request' ||
        (github.event.action != 'closed' && !github.event.pull_request.draft)) &&
      (github.event_name != 'push' || vars.CI_SKIP_MAIN_PUSH != 'true') &&
      !vars.CI_RUNS_ON && !vars.CI_RUNS_ON_FULL && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every share passed
        env:
          PLAN: ${{ needs.plan.result }}
          SUITE: ${{ needs.suite.result }}
          REST: ${{ needs.check.result }}
        run: |
          echo "the Linux list: $PLAN; its suites: $SUITE; the rest of the line: $REST"
          [ "$PLAN" = success ] && [ "$SUITE" = success ] && [ "$REST" = success ]
